name: Deploy Infra Structure

on:
  push:
    branches:
      - main
      - creando_pipeline

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código de infraestructura
        uses: actions/checkout@v4

      - name: Copiar archivos de configuración a la EC2 vía SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,mq/definitions.json,mq/rabbitmq.conf"
          target: "~/app"

      - name: Reaplicar configuraciones en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker compose -f docker-compose.prod.yml up -d